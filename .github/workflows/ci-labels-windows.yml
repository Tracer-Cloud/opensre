# Focused Windows CI runs for native shell/process changes. The `ci:windows`
# label remains the explicit opt-in for the advisory repository-wide suite.

name: CI Labels (Windows)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  OPENSRE_CICD: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Keep in sync with ci.yml — single source of truth for lint/typecheck/coverage targets.
  PYTHON_SOURCE_PATHS: "bootstrap config core integrations infrastructure surfaces tools"

concurrency:
  group: ci-labels-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-scope:
    name: windows scope
    runs-on: ubuntu-latest
    outputs:
      full_suite: ${{ steps.scope.outputs.full_suite }}
      required: ${{ steps.scope.outputs.required }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Windows-sensitive changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WINDOWS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:windows') }}
        run: |
          changed_files="$(git diff --name-only --diff-filter=ACMRD "$BASE_SHA"...HEAD)"
          echo "full_suite=$WINDOWS_LABEL" >> "$GITHUB_OUTPUT"
          if [[ "$WINDOWS_LABEL" == "true" ]] || grep -Eq \
            '^(\.github/workflows/ci-labels-windows\.yml|infrastructure/process/|tests/infrastructure/process/|tools/interactive_shell/actions/shell\.py|tools/interactive_shell/shell/|tools/interactive_shell/subprocess\.py|tests/interactive_shell/shell/)' \
            <<< "$changed_files"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

  windows-quality:
    needs: [windows-scope]
    if: needs.windows-scope.outputs.required == 'true'
    name: windows quality
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"  # avoid live ndjson "latest" fetch flakes
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run python -m ruff check ${{ env.PYTHON_SOURCE_PATHS }} tests/

      - name: Format check
        run: uv run python -m ruff format --check ${{ env.PYTHON_SOURCE_PATHS }} tests/

      - name: Typecheck
        run: uv run python -m mypy ${{ env.PYTHON_SOURCE_PATHS }}

  windows-shell:
    if: needs.windows-scope.outputs.required == 'true'
    name: windows shell
    needs: [windows-scope, windows-quality]
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"  # avoid live ndjson "latest" fetch flakes
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run native shell compatibility tests
        run: uv run python -m pytest -q tests/interactive_shell/shell/test_execution_windows.py

  windows-test:
    if: needs.windows-scope.outputs.full_suite == 'true'
    name: windows full test
    needs: [windows-scope, windows-quality]
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
      TRACER_ORG_ID: ${{ secrets.TRACER_ORG_ID }}
      TRACER_WEB_APP_URL: ${{ secrets.TRACER_WEB_APP_URL }}
      GRAFANA_READ_TOKEN: ${{ secrets.GRAFANA_READ_TOKEN }}
      GCLOUD_HOSTED_METRICS_ID: ${{ secrets.GCLOUD_HOSTED_METRICS_ID }}
      GCLOUD_HOSTED_METRICS_URL: ${{ secrets.GCLOUD_HOSTED_METRICS_URL }}
      GCLOUD_HOSTED_LOGS_ID: ${{ secrets.GCLOUD_HOSTED_LOGS_ID }}
      GCLOUD_HOSTED_LOGS_URL: ${{ secrets.GCLOUD_HOSTED_LOGS_URL }}
      GCLOUD_RW_API_KEY: ${{ secrets.GCLOUD_RW_API_KEY }}
      GCLOUD_OTLP_ENDPOINT: ${{ secrets.GCLOUD_OTLP_ENDPOINT }}
      GCLOUD_OTLP_AUTH_HEADER: ${{ secrets.GCLOUD_OTLP_AUTH_HEADER }}
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"  # avoid live ndjson "latest" fetch flakes
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run full tests
        run: >-
          uv run python -m pytest -n auto -v
          --cov=config --cov=core --cov=infrastructure.deployment.ec2 --cov=integrations --cov=infrastructure --cov=surfaces --cov=tools
          --cov-report=term-missing
          --cov-report=html
          -m "not integration"
