name: Runner provenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infrastructure/analytics/**
      - config/constants/analytics.py
      - .github/workflows/runner-provenance.yml

permissions:
  contents: read

env:
  OPENSRE_CICD: "1"

concurrency:
  group: runner-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-proof:
    if: github.repository == 'Tracer-Cloud/opensre'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      OPENSRE_DISABLE_KEYRING: "1"
      OPENSRE_SENTRY_DISABLED: "1"
      # The image has no opensre binary. The supervisor installs one on start;
      # these proofs replace CMD, so they install the same way and then record.
      CONTAINER_RECORD_INSTALL: "set -o pipefail; curl -fsSL https://install.opensre.com | bash -s -- --main --install-dir /tmp/opensre-bin && exec /tmp/opensre-bin/opensre --record-install"
      CONTAINER_RECORD_INSTALL_CI: "set -o pipefail; curl -fsSL https://install.opensre.com | bash -s -- --main --install-dir /tmp/opensre-bin && exec env CI=true GITHUB_ACTIONS=true /tmp/opensre-bin/opensre --record-install"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Build the production runtime image
        run: docker build -t opensre-provenance:${{ github.sha }} .
      - name: Native runner delivery
        run: >-
          uv run python -m infrastructure.analytics.runner_launcher
          --manifest evidence/native.json --test --require-delivery
          -- uv run opensre --record-install
      - name: Child container delivery without forwarding CI variables
        run: >-
          uv run python -m infrastructure.analytics.runner_launcher
          --docker opensre-provenance:${{ github.sha }}
          --manifest evidence/container.json --test --require-delivery
          -- bash -c "${CONTAINER_RECORD_INSTALL}"
      - name: Child container delivery with explicit CI variables
        run: >-
          uv run python -m infrastructure.analytics.runner_launcher
          --docker opensre-provenance:${{ github.sha }}
          --manifest evidence/forwarded.json --test --require-delivery
          -- bash -c "${CONTAINER_RECORD_INSTALL_CI}"
      - name: Unattributed container negative control
        shell: bash
        run: |
          set -euo pipefail
          control_home="$RUNNER_TEMP/opensre-provenance-control"
          mkdir -p "$control_home" evidence
          uv run python - "$control_home" <<'PY'
          import json, sys, uuid
          from pathlib import Path
          identity = str(uuid.uuid4())
          Path(sys.argv[1], "anonymous_id").write_text(identity)
          Path("evidence/control.json").write_text(json.dumps({"analytics_id": identity, "expected": "unknown"}))
          PY
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$control_home,target=/opensre-home" \
            --env OPENSRE_HOME=/opensre-home \
            --env OPENSRE_INSTALL_CHANNEL=runner-provenance-e2e \
            --env OPENSRE_SENTRY_DISABLED=1 \
            opensre-provenance:${{ github.sha }} bash -c "${CONTAINER_RECORD_INSTALL}"
          test -f "$control_home/installed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runner-provenance-identities
          path: evidence/*.json
          if-no-files-found: error
