[pytest]
testpaths =
    tests
    gateway/tests
    core/agent_harness/prompts/skills
python_files = test_*.py *_test.py
norecursedirs = tests/e2e .git __pycache__ .pytest_cache .venv node_modules *.egg .tox
python_functions = test_*
# importlib avoids "import file mismatch" when two test files share a basename
# (pytest's default prepend mode would import both as top-level test_enums).
addopts = -v --tb=short --durations=20 --import-mode=importlib
# A hung test otherwise burns the whole job timeout (30m) and reports nothing
# but "The operation was canceled". Fail it instead, with a stack dump of every
# thread so a deadlock is diagnosable. Well above the slowest real test (~8s);
# override per test with @pytest.mark.timeout. The method is left at the
# pytest-timeout default on purpose: SIGALRM where available, so the dump is
# relayed through the xdist worker instead of dying with it, and "thread" on
# Windows, which has no SIGALRM.
timeout = 600
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*threading\.Lock.*:UserWarning
    ignore:.*ArbitraryTypeWarning.*:UserWarning
markers =
    integration: marks tests as integration tests (may make API calls)
    live_llm: requires live LLM credentials and network access
    e2e: requires live infrastructure or external credentials (skip in offline CI)
    live_install: hits real install.opensre.com / GitHub / Homebrew (opt-in or e2e path)
